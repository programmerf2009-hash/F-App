<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071A33" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="F App — one app, one ecosystem." />
    <link rel="icon" type="image/png" href="%BASE_URL%brand/fapplogo2-512.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/fapplogo2-512.png" />
    <script>
      // Ilova hissi: pinch-zoom, double-tap zoom va Ctrl + g'ildirak zoomini bloklaymiz.
      (() => {
        const prevent = (event) => event.preventDefault();

        document.addEventListener("gesturestart", prevent, { passive: false });
        document.addEventListener("gesturechange", prevent, { passive: false });
        document.addEventListener("gestureend", prevent, { passive: false });

        document.addEventListener(
          "touchmove",
          (event) => {
            if (event.touches.length > 1) prevent(event);
          },
          { passive: false },
        );

        window.addEventListener(
          "wheel",
          (event) => {
            if (event.ctrlKey) prevent(event);
          },
          { passive: false },
        );

        window.addEventListener("keydown", (event) => {
          if (!(event.ctrlKey || event.metaKey)) return;
          if (["+", "=", "-", "_", "0"].includes(event.key)) prevent(event);
        });
      })();
    </script>
    <title>F App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
